kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 8099
name = "Discord Bot"
paths = ["/bot"]

[services.development]
run = "pnpm --filter @workspace/discord-bot run dev"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/discord-bot", "run", "start"]

[services.production.run.env]
PORT = "8099"
DISCORD_BOT_HEALTH_PORT = "8099"
NODE_ENV = "production"
DISCORD_HELP_VOICE_CHANNEL_ID = "1463996694709665986"
DISCORD_HELP_REQUEST_CHANNEL_ID = "1452753273697206427"
DISCORD_HELP_ALERT_CHANNEL_ID = "1562901066704621699"
DISCORD_VOICE_ALERT_CHANNEL_ID = "1562897075316854905"
DISCORD_BASE_ALERT_ROLE_IDS = "1452753273072254992,1463252004787978326,1452753273072254993"
DISCORD_ADMIN_ROLE_IDS = "1452753273051287735,1452753273080774718,1463250212343513241"
DISCORD_OWNER_ROLE_IDS = "1454910985268891822,1452753273080774722"

[services.production.health.startup]
path = "/healthz"
